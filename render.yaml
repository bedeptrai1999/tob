services:
  - type: worker
    name: discord-nuoi-heo
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    disk:
      name: nuoi-heo-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DB_PATH
        value: /app/data/nuoi_heo.sqlite3
      - key: GUILD_ID
        sync: false
